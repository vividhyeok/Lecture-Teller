name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Compile Python entrypoints
        run: python -m py_compile app.py stable_routes.py server_entry.py

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: lectureteller-react/package-lock.json

      - name: Install frontend dependencies
        working-directory: lectureteller-react
        run: npm ci

      - name: Build frontend
        working-directory: lectureteller-react
        run: npm run build
